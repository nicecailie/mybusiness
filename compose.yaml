services:
  db:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mybusiness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong migration password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set a separate runtime password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d mybusiness']
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: workspace
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/mybusiness
    command: [pnpm, db:migrate]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql://mybusiness_app:${APP_DB_PASSWORD}@db:5432/mybusiness
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random 32+ character secret}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:-http://localhost:3000}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ALLOW_REGISTRATION: 'false'
      ALLOW_DEMO_SEED: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: web
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api
volumes:
  postgres_data:
